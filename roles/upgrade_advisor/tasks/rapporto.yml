---
- name: Rapporto del giro precedente, per vedere cosa e' cambiato
  ansible.builtin.set_fact:
    ua_precedente: "{{ lookup('ansible.builtin.file', upgrade_advisor_cartella_rapporti ~ '/' ~ inventory_hostname ~ '.json', errors='ignore') | default('null', true) | from_json }}"

- name: Calcola la procedura consigliata
  ansible.builtin.set_fact:
    ua_esito: >-
      {{ ua_host | combine({'fonti': ua_fonti})
         | consiglia_upgrade(ua_salti, ua_salti7, ua_cve_finali, ua_precedente,
                             upgrade_advisor_obiettivo, upgrade_advisor_tipo) }}

- name: Scrivi il rapporto in JSON
  ansible.builtin.copy:
    content: "{{ ua_esito | to_nice_json }}"
    dest: "{{ upgrade_advisor_cartella_rapporti }}/{{ inventory_hostname }}.json"
    mode: "0644"
  delegate_to: localhost
  become: false
  check_mode: false

- name: Scrivi il rapporto da leggere
  ansible.builtin.template:
    src: rapporto.md.j2
    dest: "{{ upgrade_advisor_cartella_rapporti }}/{{ inventory_hostname }}.md"
    mode: "0644"
  delegate_to: localhost
  become: false
  check_mode: false

- name: Riepilogo di tutti i server
  ansible.builtin.template:
    src: riepilogo.md.j2
    dest: "{{ upgrade_advisor_cartella_rapporti }}/RIEPILOGO.md"
    mode: "0644"
  delegate_to: localhost
  become: false
  check_mode: false
  run_once: true

- name: Cosa e' cambiato dal giro precedente
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }}:
      {{ 'la procedura e'' cambiata' if ua_esito.procedura_cambiata else 'procedura uguale' }},
      falle nuove che toccano il server: {{ ua_esito.novita | length }},
      rapporto in {{ upgrade_advisor_cartella_rapporti }}/{{ inventory_hostname }}.md
